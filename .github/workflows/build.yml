name: Build Multi-Platform with Nuitka

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тега (например, v1.0.0)
  workflow_dispatch: # Позволяет запускать сборку вручную

# Даем экшену права на создание релизов
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sudoku-windows
          - os: macos-latest
            artifact_name: sudoku-macos
          - os: ubuntu-latest
            artifact_name: sudoku-linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: sudoku_slavonic.py
        mode: app
        windows-disable-console: true
        enable-plugins: pyqt6
        onefile: true
        include-data-dir: 'fonts=fonts'
        nofollow-import-to: |
          tkinter
          unittest
          email
          http
          xml
          pydoc

    # --- АРХИВАЦИЯ ДЛЯ MACOS (чтобы .app не терял структуру при скачивании) ---
    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd build
        ditto -c -k --sequesterRsrc --keepParent sudoku_slavonic.app sudoku_slavonic_macos.zip

    # --- ЗАГРУЗКА АРТЕФАКТОВ (как и раньше) ---
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          build/*.exe
          build/*.bin
          build/*.zip
        include-hidden-files: true

    # --- СОЗДАНИЕ РЕЛИЗА И ПРИКРЕПЛЕНИЕ ФАЙЛОВ ---
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v') # Запускается только если это тег
      with:
        draft: true # Создает черновик релиза, который вы сможете проверить и опубликовать
        generate_release_notes: true # Автоматически генерирует описание изменений
        files: |
          build/sudoku_slavonic.exe
          build/sudoku_slavonic.bin
          build/sudoku_slavonic_macos.zip