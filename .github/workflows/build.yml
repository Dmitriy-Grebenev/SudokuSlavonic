name: Build Multi-Platform with Nuitka

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тега (например, v1.0.1)
  workflow_dispatch: # Позволяет запускать сборку вручную

# Даем экшену права на создание релизов и загрузку файлов
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sudoku-windows
          - os: macos-latest
            artifact_name: sudoku-macos
          - os: ubuntu-latest
            artifact_name: sudoku-linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # --- Установка системных зависимостей для Linux (для AppImage) ---
    - name: Install Linux dependencies for AppImage
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libfuse2

    # --- Установка Python-зависимостей (PySide6 вместо PyQt6) ---
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6

    # --- Сборка через Nuitka ---
    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: sudoku_slavonic.py
        mode: app
        windows-console-mode: disable
        enable-plugins: pyside6
        include-data-dir: 'fonts=fonts'
        nofollow-import-to: |
          tkinter
          unittest
          email
          http
          xml
          pydoc
        # --- НОВЫЕ ПАРАМЕТРЫ ДЛЯ LINUX INSTALLER ---
        product-name: "SudokuSlavonic"
        linux-create-installer: appimage

    # --- Архивация macOS приложения в ZIP ---
    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd build
        ditto -c -k --sequesterRsrc --keepParent sudoku_slavonic.app sudoku_slavonic_macos.zip

    # --- Сохранение артефактов сборки (для проверки во вкладке Actions) ---
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          build/*.exe
          build/*.bin
          build/*.zip
          build/*.AppImage
        include-hidden-files: true

    # --- Создание черновика релиза и прикрепление файлов ---
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        draft: true
        generate_release_notes: true
        files: |
          build/sudoku_slavonic.exe
          build/sudoku_slavonic.bin
          build/sudoku_slavonic_macos.zip
          build/*.AppImage