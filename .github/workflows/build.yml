name: Build Multi-Platform

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тега, например v1.0
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sudoku-windows
            separator: ';'
            extension: '.exe'
          - os: macos-latest
            artifact_name: sudoku-macos
            separator: ':'
            extension: '.app'
          - os: ubuntu-latest
            artifact_name: sudoku-linux
            separator: ':'
            extension: ''

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 pyinstaller

    - name: Build with PyInstaller
      # Используем переменную separator из матрицы для правильного разделителя в --add-data
      run: |
        pyinstaller --onefile --windowed --add-data "fonts${{ matrix.separator }}fonts" sudoku_slavonic.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        # На macOS PyInstaller создаёт папку dist/sudoku_slavonic.app, на других — файл
        path: dist/sudoku_slavonic${{ matrix.extension }}