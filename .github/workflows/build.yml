name: Build Multi-Platform with Nuitka

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sudoku-windows
          - os: macos-latest
            artifact_name: sudoku-macos
          - os: ubuntu-latest
            artifact_name: sudoku-linux

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: sudoku_slavonic.py
        mode: app
        windows-console-mode: disable
        enable-plugins: pyside6
        include-data-dir: 'fonts=fonts'
        nofollow-import-to: |
          tkinter
          unittest
          email
          http
          xml
          pydoc
        # --- НОВАЯ ОПЦИЯ ДЛЯ LINUX ---
        # Создаёт AppImage после успешной сборки
        linux-create-installer: appimage

    - name: Zip macOS App
      if: matrix.os == 'macos-latest'
      run: |
        cd build
        ditto -c -k --sequesterRsrc --keepParent sudoku_slavonic.app sudoku_slavonic_macos.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          build/*.exe
          build/*.bin
          build/*.zip
          build/*.AppImage
        include-hidden-files: true

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        draft: true
        generate_release_notes: true
        files: |
          build/sudoku_slavonic.exe
          build/sudoku_slavonic.bin
          build/sudoku_slavonic_macos.zip
          build/sudoku_slavonic*.AppImage