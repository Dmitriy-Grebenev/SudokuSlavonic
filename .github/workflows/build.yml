name: Build Multi-Platform with Nuitka

on:
  push:
    tags:
      - 'v*' # Запуск при пуше тега, например v1.0
  workflow_dispatch: # Позволяет запускать сборку вручную

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: sudoku-windows
            # В Windows Nuitka создаст .exe
          - os: macos-latest
            artifact_name: sudoku-macos
            # В macOS Nuitka создаст .app бандл
          - os: ubuntu-latest
            artifact_name: sudoku-linux
            # В Linux Nuitka создаст бинарный файл

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6

    - name: Build with Nuitka
      uses: Nuitka/Nuitka-Action@main
      with:
        nuitka-version: main
        script-name: sudoku_slavonic.py
        # mode: app (для GUI-приложений, создает .app на macOS)[reference:2]
        mode: app
        # Аналог --windows-disable-console
        windows-disable-console: true
        # Включаем плагин для PyQt6
        enable-plugins: pyqt6
        # Аналог --onefile
        onefile: true
        # Копируем папку со шрифтами внутрь сборки
        include-data-dir: 'fonts=fonts'
        # Исключаем лишние модули (аналог ваших параметров для Nuitka)
        nofollow-import-to: |
          tkinter
          unittest
          email
          http
          xml
          pydoc

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        # Пути, куда Nuitka складывает результаты сборки на разных ОС[reference:3]
        path: |
          build/*.exe
          build/*.bin
          build/*.app/**/*
        include-hidden-files: true